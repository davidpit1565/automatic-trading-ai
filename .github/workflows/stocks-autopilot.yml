# Cloud Paper Autopilot — US STOCKS. Fully isolated from the crypto autopilot
# (autopilot.yml): separate state file, separate portfolio (USD), separate
# concurrency group. A failure or bug here cannot affect the crypto agent.
#
# Needs a free Alpaca paper-trading account (alpaca.markets, no credit card)
# and its API key added as repo secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY.
# Without them the run logs a message and exits cleanly — no error, no crash.
#
# Telegram is optional, same TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID as crypto.
# SIMULATED money only — the core has no live-order path.

name: Cloud Paper Autopilot — Stocks

on:
  schedule:
    # Every 15 min, weekdays, 13:00-21:00 UTC — a deliberately wide band
    # covering NYSE regular hours (9:30-16:00 ET) across both EST and EDT.
    # `isUsMarketOpen()` inside the script is the authoritative gate; firing
    # a little outside real hours just costs one cheap, fast no-op.
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: stocks-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Long enough for the internal loop below (24 * 5min = 120min) plus
    # headroom for npm ci / git operations.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run stocks cycles (internal 5-min loop)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Measured 2026-08-21: despite the */15 cron above, actual gaps
          # between recorded state were mostly 60-110 minutes — GitHub's
          # scheduler is unreliable at this frequency, the same root cause
          # crypto's autopilot.yml already had to work around. 24 cycles *
          # 5 min = 120 min of coverage per trigger, safely past the worst
          # gap measured, with state committed every cycle so a cancelled
          # run still keeps whatever it did.
          STOCKS_LOOP_CYCLES: '24'
          STOCKS_STATE_COMMIT_EVERY: '1'
        run: npx tsx server/stocksRunner.mts
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/stocks-state.json
          if git diff --staged --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "Stocks autopilot state ${GITHUB_RUN_ID}"
          pushed=""
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              pushed="yes"
              break
            fi
            echo "Push rejected — rebasing onto latest main (attempt $attempt)."
            git fetch origin main || true
            git rebase -X theirs origin/main || git rebase --abort || true
            sleep $((attempt * 3))
          done
          if [ -z "$pushed" ]; then
            echo "::error::Could not persist stocks autopilot state after retries." >&2
            exit 1
          fi
          echo "State persisted."
