# Deploys the dashboard to GitHub Pages on every push to the working branch.
# Method: build and force-push the output to the `gh-pages` branch — this
# needs only `contents: write` (the default token) and auto-enables Pages on
# public repos, unlike the actions/deploy-pages flow whose first-time
# enablement requires admin permissions the workflow token doesn't have.
# The published app uses browser-direct public market data (Kraken) — no
# secrets exist in this repository or in the deployed page.
#
# paths-ignore on state/** skips this entirely for the autopilot/stocks
# bots' own state-only commits (dozens/day, never touch app code) — real
# code pushes still deploy automatically. Without this, every bot commit
# forced a fresh gh-pages push, wasting CI minutes for no reason (there
# used to also be a Vercel mirror of this project whose separate git
# integration counted every one of those pushes against an account-wide
# deploy quota — the project was deleted 2026-09-04 since GitHub Pages
# was always the actual primary site, so that concern no longer applies,
# but the path filter is still worth keeping for its own sake).

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [claude/market-scan-integration-r9lck1, main]
    paths-ignore: [state/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /automatic-trading-ai/
      - name: Publish dist to gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
