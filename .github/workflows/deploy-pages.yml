# Deploys the dashboard to GitHub Pages on every push to the working branch.
# Method: build and force-push the output to the `gh-pages` branch — this
# needs only `contents: write` (the default token) and auto-enables Pages on
# public repos, unlike the actions/deploy-pages flow whose first-time
# enablement requires admin permissions the workflow token doesn't have.
# The published app uses browser-direct public market data (Kraken) — no
# secrets exist in this repository or in the deployed page.
#
# paths-ignore on state/** skips this entirely for the autopilot/stocks
# bots' own state-only commits (dozens/day, never touch app code) — real
# code pushes still deploy automatically. Without this, every bot commit
# forced a fresh gh-pages push, which wasted CI minutes and (via Vercel's
# separate git integration on this same repo) kept ticking the account-wide
# Vercel deployment quota even after main itself was excluded there.
#
# The optional "Refresh Vercel mirror" step at the end (only runs if the
# VERCEL_DEPLOY_HOOK_URL repo secret is set) exists because git.deploymentEnabled
# in vercel.json now disables ALL git-triggered deployments for `main` — that
# was the only way to stop the autopilot bots' frequent state commits (they
# land on `main` directly, not through this workflow) from exhausting the
# account-wide 100/day Vercel quota. A side effect: Vercel's production URL
# stopped updating entirely, even for real code changes, since Vercel can't
# tell a bot commit from a real one at the branch level. A Deploy Hook is a
# separate trigger (a plain POST, not a git push event) that isn't subject to
# deploymentEnabled, so calling it here — only on the same real-code-only
# runs this workflow already limited itself to — refreshes the Vercel mirror
# without reopening the quota problem. To enable: Vercel dashboard → this
# project → Settings → Git → Deploy Hooks → create one for the `main` branch,
# then add its URL as the repo secret VERCEL_DEPLOY_HOOK_URL. Until that
# secret exists, this step is a no-op and the Vercel mirror stays frozen —
# harmless, since GitHub Pages (see README.md) is the actual primary site.

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [claude/market-scan-integration-r9lck1, main]
    paths-ignore: [state/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /automatic-trading-ai/
      - name: Publish dist to gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh Vercel mirror (only if a deploy hook is configured)
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
