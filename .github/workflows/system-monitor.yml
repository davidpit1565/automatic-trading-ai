name: System Monitor — detect changes & alert

on:
  schedule:
    # Every 90 minutes, approximately. Cron doesn't support 90m exactly, so we use 2h intervals.
    # Fires at: 00:00, 02:00, 04:00, ... UTC
    - cron: '0 */2 * * *'
  workflow_dispatch: # Manual trigger for testing

# `contents: read` is what actions/checkout@v4 needs (this workflow never
# commits anything); `actions: write` is needed for the watchdog step below
# to re-trigger autopilot.yml / stocks-autopilot.yml when GitHub's own
# scheduler has silently stopped firing one of them (measured 2026-08-31:
# stocks-autopilot.yml went 3 days with zero scheduled runs despite being
# marked "active" — a known GitHub Actions limitation, not a bug in our
# code). Declaring ANY `permissions:` block replaces every default with
# exactly what's listed here — omitting `contents` would have silently
# broken checkout on the very next scheduled run.
permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run system monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx server/systemMonitorRunner.mts
